<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apps">
<meta name="theme-color" content="#0b0d14">
<title>App Library</title>
<style>
:root{--bg:#0b0d14;--tx:#f4f5fa;--tx2:rgba(244,245,250,.62);--glass:rgba(255,255,255,.09);--glass2:rgba(255,255,255,.16);--bd:rgba(255,255,255,.18);--hi:rgba(255,255,255,.35);--sh:0 18px 40px -14px rgba(0,0,0,.65);--b1:#5b6cff;--b2:#ff5fa8;--b3:#27d3c3;color-scheme:dark}
:root[data-theme=light]{--bg:#eef0f7;--tx:#14161f;--tx2:rgba(20,22,31,.6);--glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--bd:rgba(255,255,255,.9);--hi:#fff;--sh:0 18px 36px -16px rgba(40,50,90,.35);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.glass{background:var(--glass);border:1px solid var(--bd);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 var(--hi),var(--sh)}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0}
#bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.42;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
#bg i:nth-child(1){background:var(--b1);left:-18vmax;top:-18vmax}
#bg i:nth-child(2){background:var(--b2);right:-22vmax;top:18vh;animation-duration:32s}
#bg i:nth-child(3){background:var(--b3);left:10vw;bottom:-30vmax;animation-duration:38s}
:root[data-theme=light] #bg i{opacity:.3}
@keyframes drift{to{transform:translate3d(8vmax,5vmax,0) scale(1.12)}}
#lib{position:fixed;inset:0;z-index:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 max(18px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 40px) max(18px,env(safe-area-inset-left));transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
body.running #lib{opacity:0;transform:scale(.94);pointer-events:none}
.wrap{max-width:1180px;margin:0 auto}
header{position:sticky;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 14px) 0 12px;margin:0 -4px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{margin:0 auto 0 4px;font-size:30px;font-weight:760;letter-spacing:-.8px}
.search{flex:1 1 240px;max-width:380px;display:flex;align-items:center;gap:8px;padding:0 14px;height:42px;border-radius:21px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.search svg{opacity:.55;flex:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s}
.ib:active{transform:scale(.88)}
.ib.spin svg{animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 16px;border-radius:17px;cursor:pointer;font-weight:600;font-size:14px;color:var(--tx2);transition:all .25s}
.chip.on{color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));border-color:transparent}
.status{font-size:13px;color:var(--tx2);margin:6px 4px 0}
section{margin-top:26px}
section h2{margin:0 4px 12px;font-size:20px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:baseline;gap:8px}
section h2 small{font-size:13px;color:var(--tx2);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:16px}
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{flex:none;width:176px;scroll-snap-align:start}
.card{--h:230;position:relative;border-radius:26px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s;animation:pop .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*28ms);outline:0}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
.card::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 38%)}
.card:active{transform:scale(.95)}
@media(hover:hover){.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:inset 0 1px 0 var(--hi),0 28px 50px -18px hsl(var(--h) 80% 50%/.55)}}
.card:focus-visible{box-shadow:0 0 0 3px hsl(var(--h) 90% 65%)}
.pv{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 70% 40%/.45),hsl(calc(var(--h) + 40) 70% 30%/.25));display:grid;place-items:center}
.pv>img{width:100%;height:100%;object-fit:cover;display:block}
.pv iframe{position:absolute;left:0;top:0;width:1000px;height:625px;border:0;transform-origin:0 0;pointer-events:none;background:#fff}
.body{display:flex;gap:10px;align-items:center;padding:12px 12px 14px}
.txt{min-width:0;flex:1}
.nm{font-weight:680;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds{font-size:12.5px;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.icon{--s:40px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.23);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:calc(var(--s)*.5);color:#fff;background:linear-gradient(145deg,hsl(var(--h) 88% 64%),hsl(calc(var(--h) + 38) 80% 44%));box-shadow:0 6px 14px -6px hsl(var(--h) 80% 40%/.8),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 3px rgba(0,0,0,.25)}
.icon::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 50%);pointer-events:none}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.icon.xl{--s:84px}
.fav{position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;transition:transform .2s}
.fav:active{transform:scale(.8)}
.fav.on{color:#ffd45a}
.fav svg{width:18px;height:18px}
.sk{height:200px;border-radius:26px;background:linear-gradient(100deg,var(--glass) 30%,var(--glass2) 50%,var(--glass) 70%);background-size:300% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-300% 0}}
.msg{margin:28px auto;max-width:460px;text-align:center;padding:26px;border-radius:26px}
.msg b{display:block;font-size:17px;margin-bottom:6px}
.msg p{margin:0 0 14px;color:var(--tx2)}
.msg.small{padding:16px;margin:0}
.btn{height:42px;padding:0 22px;border-radius:21px;border:0;cursor:pointer;font-weight:650;color:#fff;background:linear-gradient(135deg,var(--b1),var(--b2));transition:transform .2s}
.btn:active{transform:scale(.94)}
.btn.ghost{background:var(--glass2);color:var(--tx);border:1px solid var(--bd)}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:16px;font-size:13px;color:var(--tx2)}
#appview{position:fixed;inset:0;z-index:3;background:var(--bg);visibility:hidden;opacity:0;transform:scale(1.04);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
body.running #appview{visibility:visible;opacity:1;transform:none;transition-delay:0s}
#frame{display:block;width:100vw;height:100vh;height:100dvh;border:0;background:#fff}
#back{position:fixed;z-index:6;top:calc(env(safe-area-inset-top) + 8px);left:max(10px,env(safe-area-inset-left));height:38px;padding:0 14px 0 10px;border-radius:19px;display:none;align-items:center;gap:4px;cursor:pointer;font-weight:600;font-size:14px;opacity:.5;transition:opacity .3s,transform .2s}
body.running.showback #back{display:flex}
#back:active,#back.act{opacity:1}
#sheet{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#sheet.open{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.panel{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;border-radius:30px;padding:22px;background:var(--glass2);animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.panel h3{margin:0 0 14px;font-size:22px}
.f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd)}
.f label{font-weight:600}
.f small{display:block;font-weight:400;color:var(--tx2);font-size:12px}
.f input[type=text]{width:55%;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--glass);padding:0 10px;outline:0}
.seg{display:flex;gap:4px;padding:3px;border-radius:14px;background:var(--glass)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:11px;cursor:pointer;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--glass2);color:var(--tx);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--glass);border:1px solid var(--bd);position:relative;cursor:pointer;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .25s}
.sw:checked{background:#32d26b;border-color:transparent}
.sw:checked::after{transform:translateX(20px)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
@media(max-width:520px){h1{font-size:26px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.row .card{width:156px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg"><i></i><i></i><i></i></div>

<div id="lib"><div class="wrap">
  <header>
    <div class="bar">
      <h1>Apps</h1>
      <label class="search glass"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Apps durchsuchen" autocomplete="off" enterkeyhint="search"></label>
      <button class="ib glass" id="refresh" aria-label="Aktualisieren"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="ib glass" id="settings" aria-label="Einstellungen"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="status" id="status"></div>
  </header>
  <main id="content"></main>
</div></div>

<div id="appview"><iframe id="frame" title="App" allow="fullscreen; camera; microphone; geolocation; clipboard-read; clipboard-write; autoplay; accelerometer; gyroscope; magnetometer; web-share" allowfullscreen></iframe></div>
<button id="back" class="glass"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Bibliothek</button>

<div id="sheet"><div class="panel glass" id="panel"></div></div>

<script>
"use strict";
/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function getBase(){
  try { if (/^https?:$/.test(location.protocol)) return new URL('.', location.href); } catch {}
  const r = repoInfo(), own = r.owner.toLowerCase() + '.github.io';
  return new URL(r.repo.toLowerCase() === own ? `https://${own}/` : `https://${own}/${encodeURIComponent(r.repo)}/`);
}
function repoLabel(){ const r = repoInfo(); return `${r.owner}/${r.repo}@${r.branch}`; }
function fatal(m){
  let b = document.getElementById('fatal');
  if (!b){ b = document.createElement('div'); b.id = 'fatal'; b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:99;padding:12px 14px;border-radius:14px;background:#b3261e;color:#fff;font:13px/1.4 system-ui'; b.onclick = () => b.remove(); document.body.appendChild(b); }
  b.textContent = 'Fehler: ' + m + ' (Tippen zum Schließen)';
}
window.addEventListener('error', e => fatal((e.message || 'Unbekannt') + (e.lineno ? ' (Zeile ' + e.lineno + ')' : '')));
window.addEventListener('unhandledrejection', e => fatal(String(e.reason && e.reason.message || e.reason)));
const TREE_TTL = 10 * 60e3, META_TTL = 24 * 3600e3;

/* ---------- Zustand ---------- */
const S = Object.assign({ theme: 'auto', owner: '', repo: '', branch: 'main', backBtn: true, live: false }, LS.get('al.settings', {}));
let favs = LS.get('al.favs', []), recents = LS.get('al.recents', []);
let apps = [], loading = false, error = null, note = '', updated = 0, filter = 'all', query = '';
let metaCache = LS.get('al.meta', {});

function repoInfo(){
  const host = location.hostname, m = host.match(/^([^.]+)\.github\.io$/i);
  let owner = S.owner.trim(), repo = S.repo.trim();
  if (!owner) owner = m ? m[1] : 'timi3112010-del';
  if (!repo){
    const seg = location.pathname.split('/')[1];
    repo = m ? (seg && !/\.html?$/i.test(seg) ? seg : host) : 'timi3112010-del';
  }
  return { owner, repo, branch: S.branch.trim() || 'main' };
}

/* ---------- Theme ---------- */
const mq = matchMedia('(prefers-color-scheme: light)');
function applyTheme(){
  const t = S.theme === 'auto' ? (mq.matches ? 'light' : 'dark') : S.theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#eef0f7' : '#0b0d14';
}
mq.addEventListener?.('change', applyTheme);

/* Apple-Touch-Icon per Canvas erzeugen (Home-Bildschirm) */
(function(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#5b6cff'); g.addColorStop(1, '#ff5fa8');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = 'rgba(255,255,255,.92)';
    [[36, 36], [100, 36], [36, 100], [100, 100]].forEach(p => { x.beginPath(); x.roundRect ? x.roundRect(p[0], p[1], 44, 44, 12) : x.rect(p[0], p[1], 44, 44); x.fill(); });
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch {}
})();

/* ---------- Apps laden (GitHub Git-Trees-API: nur 1 Anfrage) ---------- */
function prettify(s){
  s = decodeURIComponent(s).replace(/\.html?$/i, '').replace(/[-_]+/g, ' ').trim();
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : 'App';
}
function hashHue(s){ let h = 7; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
const enc = p => p.split('/').map(encodeURIComponent).join('/');

function parseTree(tree){
  const out = [], seen = new Set();
  for (const it of tree){
    if (it.type !== 'blob' || typeof it.path !== 'string') continue;
    let m, app = null;
    if ((m = it.path.match(/^(htmls)\/([^\/]+\.html?)$/i))) app = { cat: 'html', file: m[2], path: m[1] + '/' + enc(m[2]) };
    else if ((m = it.path.match(/^(webapps)\/([^\/]+)\/index\.html?$/i))) app = { cat: 'webapp', file: m[2], path: m[1] + '/' + enc(m[2]) + '/' };
    if (!app) continue;
    app.id = app.cat + ':' + app.file.toLowerCase();
    if (seen.has(app.id)) continue;
    seen.add(app.id);
    app.name = prettify(app.file);
    app.hue = hashHue(app.file);
    app.url = new URL(app.path, getBase()).href;
    out.push(app);
  }
  return out.sort((a, b) => a.name.localeCompare(b.name, 'de', { numeric: true }));
}

async function loadApps(force){
  const key = 'al.tree.' + JSON.stringify(repoInfo());
  const cached = LS.get(key, null);
  if (!force && cached && Date.now() - cached.t < TREE_TTL){
    apps = cached.apps; updated = cached.t; error = null; note = ''; render(); enrich(false); return;
  }
  loading = true; error = null; note = ''; setSpin(true); render();
  const { owner, repo, branch } = repoInfo();
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' }, signal: ctl.signal });
    clearTimeout(to);
    if (!res.ok){
      if ((res.status === 403 || res.status === 429) && res.headers.get('x-ratelimit-remaining') === '0'){
        const r = +res.headers.get('x-ratelimit-reset') * 1000;
        throw new Error('GitHub-Limit erreicht' + (r ? '. Neuer Versuch ab ' + new Date(r).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr.' : '.'));
      }
      if (res.status === 404) throw new Error(`Repository „${owner}/${repo}“ oder Branch „${branch}“ nicht gefunden. Prüfe die Einstellungen.`);
      throw new Error('GitHub antwortete mit Status ' + res.status + '.');
    }
    const data = await res.json();
    if (!data || !Array.isArray(data.tree)) throw new Error('Unerwartete Antwort von GitHub.');
    apps = parseTree(data.tree); updated = Date.now();
    if (data.truncated) note = 'Die Dateiliste ist sehr groß und wurde von GitHub gekürzt.';
    LS.set(key, { t: updated, apps });
    enrich(force);
  } catch (e){
    error = e.name === 'AbortError' ? 'Zeitüberschreitung beim Laden von GitHub.' : (e.message || 'Unbekannter Fehler.');
    if (!navigator.onLine) error = 'Keine Internetverbindung.';
    if (cached){ apps = cached.apps; updated = cached.t; note = 'Zeige gespeicherte Liste. ' + error; error = null; enrich(false); }
    else apps = [];
  } finally { loading = false; setSpin(false); render(); }
}

/* ---------- Metadaten aus HTML auslesen (DOMParser führt keine Skripte aus) ---------- */
function toHue(hex){
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex || ''); if (!m) return null;
  let h = m[1]; if (h.length === 3) h = h.replace(/./g, c => c + c);
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (d < .12) return null; /* zu grau/schwarz/weiß für eine Akzentfarbe */
  const v = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return Math.round((v * 60 + 360) % 360);
}
async function readMeta(a){
  const res = await fetch(a.url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(res.status);
  const text = (await res.text()).slice(0, 250000);
  if (!/<(html|head|body|title|script|div)\b/i.test(text)) throw new Error('keine HTML-Datei');
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const abs = u => { try { return u ? new URL(u, a.url).href : ''; } catch { return ''; } };
  const q = s => doc.querySelector(s);
  const mt = n => (q(`meta[name="${n}"]`) || q(`meta[property="${n}"]`))?.getAttribute('content')?.trim() || '';
  const lk = r => abs(q(`link[rel~="${r}"][href]`)?.getAttribute('href'));
  const icon = lk('apple-touch-icon') || lk('apple-touch-icon-precomposed') || abs(q('link[rel~="icon"][href]')?.getAttribute('href')) || lk('shortcut') || abs(mt('og:image')) || abs(q('link[rel*="icon"][href]')?.getAttribute('href'));
  let name = mt('apple-mobile-web-app-title') || mt('application-name') || mt('og:site_name');
  const title = doc.title?.trim();
  if (!name && title && title.length <= 28) name = title;
  const css = (text.match(/--(?:accent|primary|brand|main)[\w-]*\s*:\s*(#[0-9a-f]{3,6})\b/i) || [])[1];
  const hue = toHue(mt('theme-color')) ?? toHue(css);
  return { t: Date.now(), name, desc: (mt('description') || mt('og:description')).slice(0, 160), icon, og: abs(mt('og:image')), hue };
}
function applyMeta(a, m){
  if (!m) return;
  if (m.name) a.name = m.name;
  a.desc = m.desc || ''; a.icon = m.icon || ''; a.og = m.og || '';
  if (m.hue != null) a.hue = m.hue;
}
let renderTimer = 0;
function softRender(){ clearTimeout(renderTimer); renderTimer = setTimeout(render, 350); }
async function enrich(force){
  const todo = [];
  for (const a of apps){
    const c = metaCache[a.id];
    if (c && !force && Date.now() - c.t < META_TTL) applyMeta(a, c); else todo.push(a);
  }
  const snapshot = apps; let idx = 0;
  const worker = async () => {
    while (idx < todo.length && snapshot === apps){
      const a = todo[idx++];
      try { const m = await readMeta(a); metaCache[a.id] = m; applyMeta(a, m); }
      catch { /* Metadaten nicht lesbar: App bleibt sichtbar, mit generiertem Icon */ }
      softRender();
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);
  LS.set('al.meta', metaCache);
}

/* ---------- Rendering ---------- */
function iconEl(a, size){
  const d = el('div', 'icon' + (size ? ' ' + size : ''), (a.name.trim()[0] || '?').toUpperCase());
  d.style.setProperty('--h', a.hue);
  if (a.icon){
    const i = new Image(); i.alt = ''; i.loading = 'lazy'; i.decoding = 'async'; i.referrerPolicy = 'no-referrer';
    i.onerror = () => i.remove(); d.appendChild(i); i.src = a.icon;
  }
  return d;
}
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; io.unobserve(e.target); mountLive(e.target);
}), { rootMargin: '200px' }) : null;
function mountLive(box){
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', ''); /* keine Skripte, kein Speicher, keine Navigation */
  f.setAttribute('tabindex', '-1'); f.setAttribute('aria-hidden', 'true'); f.loading = 'lazy';
  f.style.transform = `scale(${(box.clientWidth || 176) / 1000})`;
  f.src = box.dataset.url; box.appendChild(f);
}
function card(a, i){
  const c = el('article', 'card glass'); c.style.setProperty('--h', a.hue); c.style.setProperty('--i', Math.min(i, 24));
  c.tabIndex = 0; c.setAttribute('role', 'button'); c.setAttribute('aria-label', a.name + ' öffnen');
  const pv = el('div', 'pv'); const big = () => { pv.replaceChildren(iconEl(a, 'xl')); };
  if (a.og){ const im = new Image(); im.alt = ''; im.loading = 'lazy'; im.onerror = big; im.src = a.og; pv.appendChild(im); }
  else if (S.live && io){ pv.dataset.url = a.url; big(); const ic = pv.firstChild; pv.dataset.ic = '1'; io.observe(pv); pv.addEventListener('mount', () => ic.remove()); }
  else big();
  const fv = el('button', 'fav' + (favs.includes(a.id) ? ' on' : '')); fv.setAttribute('aria-label', 'Favorit');
  fv.innerHTML = '<svg viewBox="0 0 24 24" fill="' + (favs.includes(a.id) ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m12 3 2.8 5.8 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.3l1.1-6.2L3 9.7l6.2-.9z"/></svg>';
  fv.onclick = e => { e.stopPropagation(); toggleFav(a.id); };
  const body = el('div', 'body'), tx = el('div', 'txt');
  tx.append(el('div', 'nm', a.name), el('div', 'ds', a.desc || `Öffne ${a.name} im Vollbild.`));
  body.append(iconEl(a), tx);
  c.append(pv, fv, body);
  c.onclick = () => openApp(a);
  c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openApp(a); } };
  return c;
}
function section(title, list, empty, row){
  const s = el('section'), h = el('h2', null, title); h.appendChild(el('small', null, String(list.length)));
  s.appendChild(h);
  if (!list.length){ s.appendChild(el('div', 'msg small glass', empty)); return s; }
  const g = el('div', row ? 'row' : 'grid'); list.forEach((a, i) => g.appendChild(card(a, i))); s.appendChild(g); return s;
}
function matches(a){
  const q = query.trim().toLowerCase();
  return !q || (a.name + ' ' + (a.desc || '') + ' ' + a.file).toLowerCase().includes(q);
}
function render(){
  const root = $('#content'), keep = $('#lib').scrollTop; root.replaceChildren();
  const chips = $('#chips'); chips.replaceChildren();
  [['all', 'Alle'], ['html', 'HTMLs'], ['webapp', 'Webapps'], ['fav', '★ Favoriten']].forEach(([k, l]) => {
    const b = el('button', 'chip glass' + (filter === k ? ' on' : ''), l); b.onclick = () => { filter = k; render(); }; chips.appendChild(b);
  });
  $('#status').textContent = loading ? 'Lade Apps von GitHub …' : apps.length ? `${apps.length} Apps · ${repoLabel()}${updated ? ' · Stand ' + new Date(updated).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : ''}` : '';
  if (note){ const b = el('div', 'banner glass', note); root.appendChild(b); }
  if (loading && !apps.length){
    const g = el('div', 'grid'); g.style.marginTop = '26px';
    for (let i = 0; i < 8; i++) g.appendChild(el('div', 'sk')); root.appendChild(g); return;
  }
  if (error){
    const m = el('div', 'msg glass'); m.append(el('b', null, 'Apps konnten nicht geladen werden'), el('p', null, error));
    const b = el('button', 'btn', 'Erneut versuchen'); b.onclick = () => loadApps(true); m.appendChild(b); root.appendChild(m); return;
  }
  const valid = apps.filter(a => !metaCache[a.id]?.invalid);
  const list = valid.filter(matches);
  if (query.trim()){
    root.appendChild(list.length ? section('Suchergebnisse', list, '') : Object.assign(el('div', 'msg glass'), { innerHTML: '' }));
    if (!list.length){ const m = root.lastChild; m.append(el('b', null, 'Keine Treffer'), el('p', null, `Nichts gefunden für „${query.trim()}“.`)); }
    $('#lib').scrollTop = keep; return;
  }
  if (!apps.length){
    const m = el('div', 'msg glass'); m.append(el('b', null, 'Noch keine Apps'), el('p', null, `In ${repoLabel()} wurde nichts gefunden. Erwartet werden .html-Dateien in „htmls“ oder Ordner mit index.html in „webapps“. Stimmen Nutzer, Repository und Branch? Du kannst sie unter Einstellungen ändern.`));
    const b = el('button', 'btn', 'Aktualisieren'); b.onclick = () => loadApps(true); m.appendChild(b); root.appendChild(m); return;
  }
  const byId = new Map(valid.map(a => [a.id, a]));
  if (filter === 'all'){
    const fl = favs.map(id => byId.get(id)).filter(Boolean), rc = recents.map(id => byId.get(id)).filter(Boolean);
    if (fl.length) root.appendChild(section('Favoriten', fl, '', true));
    if (rc.length) root.appendChild(section('Zuletzt geöffnet', rc, '', true));
  }
  if (filter === 'fav'){
    root.appendChild(section('Favoriten', valid.filter(a => favs.includes(a.id)), 'Tippe auf den Stern einer App, um sie hier zu speichern.'));
  } else {
    if (filter !== 'webapp') root.appendChild(section('HTMLs', valid.filter(a => a.cat === 'html'), 'Hier ist noch nichts. Lege .html-Dateien in den Ordner „htmls“.'));
    if (filter !== 'html') root.appendChild(section('Webapps', valid.filter(a => a.cat === 'webapp'), 'Hier ist noch nichts. Lege Ordner mit einer index.html in „webapps“.'));
  }
  $('#lib').scrollTop = keep;
}
function setSpin(on){ $('#refresh').classList.toggle('spin', on); }

/* ---------- Favoriten / Zuletzt ---------- */
function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(x => x !== id) : [id, ...favs];
  LS.set('al.favs', favs); render();
}
function pushRecent(id){ recents = [id, ...recents.filter(x => x !== id)].slice(0, 12); LS.set('al.recents', recents); }

/* ---------- App öffnen / schließen ---------- */
let backTimer = 0;
function openApp(a){
  pushRecent(a.id);
  const f = $('#frame'); f.src = a.url;
  document.body.classList.add('running');
  document.body.classList.toggle('showback', !!S.backBtn);
  document.title = a.name; flashBack();
}
function closeApp(){
  document.body.classList.remove('running', 'showback');
  setTimeout(() => { if (!document.body.classList.contains('running')) $('#frame').src = 'about:blank'; }, 480);
  document.title = 'App Library'; render();
}
function flashBack(){ const b = $('#back'); b.classList.add('act'); clearTimeout(backTimer); backTimer = setTimeout(() => b.classList.remove('act'), 2800); }

/* ---------- Einstellungen ---------- */
function saveSettings(){ LS.set('al.settings', S); }
function openSettings(){
  const p = $('#panel'); p.replaceChildren(el('h3', null, 'Einstellungen'));
  const row = (label, sub, ctrl) => { const f = el('div', 'f'), l = el('label', null, label); if (sub) l.appendChild(el('small', null, sub)); f.append(l, ctrl); p.appendChild(f); };
  const seg = el('div', 'seg');
  [['auto', 'Auto'], ['light', 'Hell'], ['dark', 'Dunkel']].forEach(([k, l]) => { const b = el('button', S.theme === k ? 'on' : '', l); b.onclick = () => { S.theme = k; saveSettings(); applyTheme(); seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }; seg.appendChild(b); });
  row('Darstellung', '', seg);
  const sw = (key, onchg) => { const i = el('input', 'sw'); i.type = 'checkbox'; i.checked = !!S[key]; i.onchange = () => { S[key] = i.checked; saveSettings(); onchg && onchg(); }; return i; };
  row('Zurück-Button', 'Kleine Schaltfläche in geöffneten Apps', sw('backBtn'));
  row('Live-Vorschau', 'Rendert Apps ohne Skripte als Vorschau. Kann auf dem iPad Leistung kosten.', sw('live', render));
  const inp = (key, ph) => { const i = el('input'); i.type = 'text'; i.value = S[key]; i.placeholder = ph; i.autocapitalize = 'off'; i.autocorrect = 'off'; i.spellcheck = false; i.onchange = () => { S[key] = i.value.trim(); saveSettings(); }; return i; };
  const ri = repoInfo();
  row('GitHub-Nutzer', 'Leer = automatisch', inp('owner', ri.owner));
  row('Repository', 'Leer = automatisch', inp('repo', ri.repo));
  row('Branch', '', inp('branch', 'main'));
  const acts = el('div', 'acts');
  const apply = el('button', 'btn', 'Übernehmen & laden'); apply.onclick = () => { $('#sheet').classList.remove('open'); loadApps(true); };
  const clr = el('button', 'btn ghost', 'Cache leeren'); clr.onclick = () => { Object.keys(localStorage).filter(k => k.startsWith('al.tree.') || k === 'al.meta').forEach(k => LS.del(k)); metaCache = {}; clr.textContent = 'Geleert ✓'; };
  const rst = el('button', 'btn ghost', 'Favoriten zurücksetzen'); rst.onclick = () => { favs = []; recents = []; LS.set('al.favs', favs); LS.set('al.recents', recents); rst.textContent = 'Zurückgesetzt ✓'; render(); };
  const cls = el('button', 'btn ghost', 'Schließen'); cls.onclick = () => $('#sheet').classList.remove('open');
  acts.append(apply, clr, rst, cls); p.appendChild(acts);
  $('#sheet').classList.add('open');
}

/* ---------- Start ---------- */
$('#q').addEventListener('input', e => { query = e.target.value; render(); });
$('#refresh').onclick = () => loadApps(true);
$('#settings').onclick = openSettings;
$('#back').onclick = closeApp;
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') e.currentTarget.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#sheet').classList.contains('open')) $('#sheet').classList.remove('open'); else if (document.body.classList.contains('running')) closeApp(); } });
window.addEventListener('online', () => { if (error) loadApps(true); });
applyTheme(); render(); loadApps(false);
</script>
</body>
