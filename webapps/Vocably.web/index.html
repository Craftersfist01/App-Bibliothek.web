<title>Vocably</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#1f3d2e">
<style>
:root{--h:150;--bg:hsl(var(--h) 20% 96%);--fg:hsl(var(--h) 25% 10%);--mut:hsl(var(--h) 8% 42%);--ac:hsl(var(--h) 42% 28%);--tint:hsl(var(--h) 45% 90%);--line:hsl(var(--h) 12% 82%);--sf:hsl(var(--h) 20% 98%/.72);--bad:#b3402e;--ok:hsl(var(--h) 55% 30%);--v1:hsl(var(--h) 40% 30%);--v2:hsl(calc(var(--h) + 14) 28% 52%);--v3:hsl(calc(var(--h) - 12) 38% 66%)}
[data-t=dark]{--bg:hsl(var(--h) 18% 8%);--fg:hsl(var(--h) 20% 92%);--mut:hsl(var(--h) 8% 62%);--ac:hsl(var(--h) 40% 62%);--tint:hsl(var(--h) 25% 15%);--line:hsl(var(--h) 12% 20%);--sf:hsl(var(--h) 18% 11%/.72);--bad:#e0705c;--ok:hsl(var(--h) 50% 62%)}
html.nodyn{--v2:var(--v1);--v3:var(--v1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea,select{user-select:text;-webkit-user-select:text}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;min-height:54px}
header h1{font-size:19px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto;padding:4px 16px 100px;-webkit-overflow-scrolling:touch}
nav{display:flex;border-top:1px solid var(--line);background:var(--sf);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;min-height:50px}
nav button.on{color:var(--ac);box-shadow:inset 0 2px var(--ac)}
.b{padding:10px 14px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:4px;font:inherit;font-size:15px;min-height:44px}
.b.p{background:var(--ac);border-color:var(--ac);color:var(--bg)}.b.g{border:0;color:var(--mut);padding:10px 12px}.b.d{color:var(--bad)}
.fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border:0;border-radius:14px 4px 14px 4px;background:var(--ac);color:var(--bg);font-size:30px;box-shadow:0 6px 18px #0004}
input,textarea,select{border:0;border-bottom:1.5px solid var(--line);background:transparent;color:inherit;font:inherit;padding:10px 2px;width:100%;outline:0;border-radius:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}select option{color:#111}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}input[type=range]{border:0;padding:0}
textarea{border:1.5px solid var(--line);padding:10px;resize:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px}.chip{flex:none;padding:7px 12px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:14px;border-radius:2px 10px 2px 10px}.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.set{display:flex;align-items:center;gap:8px;padding:12px 0 12px 12px;border-bottom:1px solid var(--line);border-left:3px solid var(--v1)}
.set:nth-child(3n+2){border-left-color:var(--v2)}.set:nth-child(3n){border-left-color:var(--v3)}
.set .gr{flex:1;min-width:0}.set b{display:block;font-weight:600}small,.mut{color:var(--mut);font-size:13px}
.bar{display:block;height:3px;background:var(--line);margin-top:8px}.bar u{display:block;height:100%;background:var(--ac)}
h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin:22px 0 6px;font-weight:600}
.row{padding:10px 0;border-bottom:1px solid var(--line)}.two{display:flex;gap:14px}.rb{display:flex;justify-content:flex-end}.rb .b{min-height:36px;padding:4px 12px}.n{font-size:12px;color:var(--mut)}
.ov{position:fixed;inset:0;background:#0007;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:9}.ov.on{display:flex}
.sh{background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-height:88dvh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sh h3{margin:0 0 10px;font-size:17px}.sh .b{display:block;width:100%;text-align:left;margin:6px 0}.r{display:flex;gap:8px}.r .b{text-align:center}
.o{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.o select,.o input:not([type=checkbox]){width:150px}.o em{font-size:13px;color:var(--mut);font-style:normal;min-width:64px}
#toast{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top));background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:3px;z-index:20;display:none}
#st{width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:4px}#st.err{background:var(--bad)}
.q{text-align:center;padding:30px 0 20px}.q .w{font-size:30px;font-weight:600;word-break:break-word}.pips{display:flex;gap:5px;justify-content:center;margin:14px 0}.pips i{width:22px;height:4px;background:var(--line)}.pips i.f{background:var(--ac)}.pips.bd i.f{background:var(--bad)}
.fb{padding:14px;border-left:3px solid var(--ok);background:var(--tint);margin:14px 0}.fb.x{border-color:var(--bad)}.fb b{font-size:20px}
.sw{display:inline-block;width:38px;height:38px;border:2px solid transparent;margin:0 8px 8px 0;border-radius:2px 12px}.sw.on{border-color:var(--fg)}
.pv{display:flex;gap:8px;align-items:center}.pv.bad input{border-color:var(--bad)}.pv.dup{opacity:.4}
.days{display:flex;gap:6px;align-items:flex-end;height:90px}.days div{flex:1;background:var(--ac);min-height:2px;opacity:.85}
main.in{animation:vin .24s ease-out}.ov.on{animation:fade .18s ease-out}.ov.on .sh{animation:up .24s cubic-bezier(.2,.8,.2,1)}
.q .w{animation:vin .25s ease-out}.fb{animation:pop .28s ease-out}.fb.x{animation:shake .38s}#toast{animation:vin .2s ease-out}
.b,.chip,nav button,.fab{transition:transform .12s,background .15s}.b:active,.chip:active,.fab:active{transform:scale(.96)}.set:active{background:var(--tint)}.bar u{transition:width .5s ease}
.ck{display:block;margin:0 auto 12px}.ck path{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:square;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .1s ease-out forwards}.ck circle{fill:none;stroke:var(--line);stroke-width:2}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:none;opacity:1}}@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}@keyframes draw{to{stroke-dashoffset:0}}
html.noanim *,html.noanim *::before{animation:none!important;transition:none!important}.ck path{stroke-dashoffset:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:square;stroke-linejoin:miter;vertical-align:middle;flex:none}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;padding:9px 0 8px}
.sh .b .i{margin-right:12px}.fab .i{width:28px;height:28px}.b.g .i{margin:0}.fb b .i{vertical-align:-5px;margin-right:6px}.rb .b{padding:4px 10px}header .b .i{width:23px;height:23px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}.seg button{padding:8px 13px;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;min-height:38px}.seg button.on{background:var(--ac);color:var(--bg)}
.stp{display:flex;align-items:center}.stp button{width:38px;height:38px;border:1px solid var(--line);background:none;color:var(--fg);font-size:20px;line-height:1}.stp b{min-width:36px;text-align:center}
.sw2{position:relative;width:46px;height:26px;flex:none}.sw2 input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0}.sw2 i{position:absolute;inset:0;background:var(--line);border-radius:2px 13px;transition:background .2s}.sw2 i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:var(--bg);border-radius:2px 10px;transition:transform .2s}.sw2 input:checked+i{background:var(--ac)}.sw2 input:checked+i::after{transform:translateX(20px)}
.grp{margin:16px 0}.grp>h2{margin:6px 0 2px}.grp summary{padding:12px 0;color:var(--mut);font-size:13px;letter-spacing:.8px;text-transform:uppercase;font-weight:600;list-style:none}.grp summary::-webkit-details-marker{display:none}.grp summary::after{content:" ▾"}
.hero{position:relative;padding:16px 16px 14px;margin:6px 0 10px;background:var(--tint);border-left:4px solid var(--ac);border-radius:2px 18px 2px 18px}.hero b{display:block;font-size:22px;margin:2px 0}.hero span{color:var(--mut);font-size:14px}.hero em{display:flex;gap:8px;align-items:center;margin-top:14px;font-style:normal;color:var(--ac);font-weight:600}.hero:active{transform:scale(.99)}
.emptyst{text-align:center;padding:56px 20px;color:var(--mut)}.emptyst .i{width:46px;height:46px;margin-bottom:8px;opacity:.55}.emptyst .b{margin-top:6px}
.bx{color:var(--bad);font-weight:700;background:color-mix(in srgb,var(--bad) 20%,transparent)}.bs{font-weight:700;border-bottom:3px solid var(--bad)}.df{margin:6px 0 10px;white-space:pre-wrap;font-size:20px;word-break:break-word}.df small{display:block}
.tk{border-bottom:1px dotted var(--mut)}.tk:active{background:var(--tint)}
