<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat GPT</title>
<style>
:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--hover:#2a2a2a;--text:#ececec;--mute:#9b9b9b;--line:#3a3a3a;--acc:#10a37f}
@media (prefers-color-scheme:light){:root.auto{--bg:#fff;--side:#f9f9f9;--panel:#f4f4f4;--hover:#ececec;--text:#0d0d0d;--mute:#6b6b6b;--line:#e5e5e5}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#side{width:260px;background:var(--side);display:flex;flex-direction:column;padding:10px;gap:6px;flex-shrink:0;transition:margin .25s;padding-top:max(10px,env(safe-area-inset-top))}
#side.hide{margin-left:-260px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;width:100%;text-align:left}
i[data-i]{display:inline-flex;flex-shrink:0}svg{display:block}#model{display:flex;align-items:center;gap:8px}#model small{margin-left:0}.av{color:#fff}#hero .logo{color:var(--acc);display:flex}.act button.on{color:var(--acc)}.act button.on svg{fill:currentColor}.nb:hover,.ci:hover,.ci.on{background:var(--hover)}
.lbl{font-size:12px;color:var(--mute);padding:14px 12px 4px}
#list{flex:1;overflow-y:auto}
.ci{display:flex;align-items:center;border-radius:10px;padding:0 4px 0 12px;font-size:14px}
.ci span{flex:1;padding:10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .x{opacity:0;padding:8px;color:var(--mute)}
.ci:hover .x,.ci.on .x{opacity:1}
.usr{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px;border-top:1px solid var(--line)}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:17px;flex-shrink:0}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
#top button{padding:8px 10px;border-radius:10px}
#top button:hover{background:var(--hover)}
#model{font-size:18px;font-weight:600}
#model small{color:var(--mute);font-weight:400;margin-left:4px}
#chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:0 18px}
#hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#hero .logo{font-size:56px}
#hero h1{font-size:28px;font-weight:600;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;color:var(--mute)}
.chip:hover{background:var(--hover);color:var(--text)}
.msg{display:flex;padding:14px 0;gap:14px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg>.col{width:100%;flex:1;min-width:0}
.bub{background:var(--panel);border-radius:20px;padding:10px 18px;max-width:80%;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.bot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex-shrink:0;margin-top:2px}
.body{flex:1;min-width:0}
.pic{display:block;max-width:100%;max-height:420px;border-radius:16px;cursor:zoom-in;background:var(--panel)}
.act{display:flex;gap:2px;margin-top:8px;color:var(--mute)}
.act button{padding:6px 8px;border-radius:8px;font-size:15px}
.act button:hover{background:var(--hover);color:var(--text)}
.dots{display:flex;gap:5px;padding:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
#bar{padding:8px 14px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#box{max-width:760px;margin:0 auto;background:var(--panel);border-radius:28px;display:flex;align-items:flex-end;padding:8px 8px 8px 20px;gap:8px}
#in{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:180px;padding:8px 0;line-height:1.4}
#in::placeholder{color:var(--mute)}
#send{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex-shrink:0;transition:opacity .2s}
#send:disabled{opacity:.25;cursor:default}
.fine{text-align:center;font-size:12px;color:var(--mute);padding-top:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;place-items:center;z-index:9;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:94vw;max-height:92vh;border-radius:12px}
@media(max-width:760px){#side{position:fixed;z-index:5;height:100%;box-shadow:4px 0 24px rgba(0,0,0,.4)}#side.hide{margin-left:-270px;box-shadow:none}.bub{max-width:88%}}
</style>
</head>
<body>
<aside id="side">
  <button class="nb" id="new"><i data-i="edit"></i>Neuer Chat</button>
  <div class="lbl">Chats</div>
  <div id="list"></div>
  <div class="usr"><div class="av"><i data-i="cat"></i></div>Katzenfreund</div>
</aside>
<div id="main">
  <div id="top">
    <button id="tog" aria-label="Seitenleiste"><i data-i="menu" data-s="20"></i></button>
    <div id="model"><i data-i="paw" data-s="20"></i>Cat GPT <small>Meow-4</small></div>
  </div>
  <div id="chat"></div>
  <div id="bar">
    <div id="box">
      <textarea id="in" rows="1" placeholder="Schreib Cat GPT eine Nachricht"></textarea>
      <button id="send" disabled aria-label="Senden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="fine">Cat GPT kann nur Katzen. Und das ziemlich gut.</div>
  </div>
</div>
<div id="lb"><img alt=""></div>
<script>
const $=s=>document.querySelector(s);
const P={
edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
menu:'<path d="M4 7h16M4 12h16M4 17h10"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/>',
cat:'<path d="M5 9V3.5L9 6.5h6L19 3.5V9c.4.5 1 1.6 1.5 2.5.4.8.5 1.7.5 2.5 0 4-4 7-9 7s-9-3-9-7c0-.8.1-1.7.5-2.5C4 10.600 4.600 9.500 5 9Z"/><circle cx="9" cy="13" r=".7" fill="currentColor"/><circle cx="15" cy="13" r=".7" fill="currentColor"/><path d="M10.500 16.500l1.500 1 1.500-1M3 14l-1.500-.5M3 16l-1.500.8M21 14l1.500-.5M21 16l1.500.8"/>',
paw:'<g fill="currentColor" stroke="none"><ellipse cx="5.500" cy="11" rx="2" ry="2.600"/><ellipse cx="9.500" cy="6" rx="2" ry="2.700"/><ellipse cx="14.500" cy="6" rx="2" ry="2.700"/><ellipse cx="18.500" cy="11" rx="2" ry="2.600"/><path d="M12 11.500c-3.200 0-6 3.600-6 6.100 0 2 1.800 2.600 3 2.200 1-.3 2-.7 3-.7s2 .4 3 .7c1.200.4 3-.2 3-2.200 0-2.500-2.800-6.100-6-6.100Z"/></g>',
copy:'<rect x="9" y="9" width="11" height="11" rx="2.500"/><path d="M5 15V6.500A2.500 2.500 0 0 1 7.500 4H15"/>',
thumb:'<path d="M7 11v9H4v-9ZM7 11l4-8c1.500 0 2.500 1 2.500 2.500V9h5a2 2 0 0 1 2 2.300l-1.200 7a2 2 0 0 1-2 1.700H7"/>',
dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
check:'<path d="M5 12.500l4.500 4.500L19 7"/>'};
const ic=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i,+e.dataset.s||18));
const chatEl=$('#chat'),inEl=$('#in'),sendEl=$('#send'),listEl=$('#list'),side=$('#side');
let chats=[],cur=null,busy=false;
try{chats=JSON.parse(localStorage.getItem('catgpt')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('catgpt',JSON.stringify(chats))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function catUrl(){
  // 1) TheCatAPI, 2) Fallback: CATAAS
  try{
    const r=await fetch('https://api.thecatapi.com/v1/images/search');
    const j=await r.json();
    if(j[0]&&j[0].url)return j[0].url;
  }catch(e){}
  return 'https://cataas.com/cat?t='+Date.now();
}
function preload(u){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(u);i.onerror=no;i.src=u})}
async function getCat(){
  for(let t=0;t<3;t++){try{return await preload(await catUrl())}catch(e){}}
  throw 0;
}

function newChat(){
  if(cur&&!cur.msgs.length){render();return}
  cur={id:uid(),title:'Neuer Chat',msgs:[]};chats.unshift(cur);save();render();
  if(innerWidth<=760)side.classList.add('hide');
}
function open(id){cur=chats.find(c=>c.id==id);render();if(innerWidth<=760)side.classList.add('hide')}
function del(id,e){
  e.stopPropagation();
  chats=chats.filter(c=>c.id!=id);save();
  if(cur&&cur.id==id)cur=chats[0]||null;
  if(!cur)newChat();else render();
}
function renderList(){
  listEl.innerHTML=chats.map(c=>`<div class="ci ${cur&&c.id==cur.id?'on':''}" data-id="${c.id}"><span>${esc(c.title)}</span><button class="x" data-del="${c.id}" aria-label="Löschen">${ic('trash',16)}</button></div>`).join('');
}
function msgHTML(m){
  if(m.r=='u')return `<div class="msg u"><div class="col" style="display:flex;justify-content:flex-end"><div class="bub">${esc(m.t)}</div></div></div>`;
  return `<div class="msg"><div class="col" style="display:flex;gap:14px"><div class="bot">${ic('cat',17)}</div><div class="body"><img class="pic" src="${m.img}" alt="Katze"><div class="act"><button data-a="copy" data-u="${m.img}" title="Link kopieren">${ic('copy',16)}</button><button data-a="like" title="Gut">${ic('thumb',16)}</button><button data-a="dl" data-u="${m.img}" title="Öffnen">${ic('dl',16)}</button></div></div></div></div>`;
}
function render(){
  renderList();
  if(!cur||!cur.msgs.length){
    chatEl.innerHTML=`<div id="hero"><div class="logo">${ic('cat',60)}</div><h1>Wie kann ich dir helfen, miau?</h1><div class="chips"><button class="chip">Erkläre mir Quantenphysik</button><button class="chip">Schreib mir einen Businessplan</button><button class="chip">Was ist der Sinn des Lebens?</button><button class="chip">Hilf mir bei meinen Hausaufgaben</button></div></div>`;
  }else{
    chatEl.innerHTML=cur.msgs.map(msgHTML).join('');
    chatEl.scrollTop=chatEl.scrollHeight;
  }
}
function typing(){
  const d=document.createElement('div');d.className='msg';d.id='typ';
  d.innerHTML='<div class="col" style="display:flex;gap:14px"><div class="bot">'+ic('cat',17)+'</div><div class="dots"><i></i><i></i><i></i></div></div>';
  chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
}
async function send(text){
  text=text.trim();if(!text||busy)return;
  if(!cur)newChat();
  busy=true;sendEl.disabled=true;
  if(!cur.msgs.length)cur.title=text.slice(0,32);
  cur.msgs.push({r:'u',t:text});save();
  inEl.value='';inEl.style.height='auto';
  render();typing();
  const t0=Date.now();
  try{
    const img=await getCat();
    await new Promise(r=>setTimeout(r,Math.max(0,700-(Date.now()-t0))));
    cur.msgs.push({r:'a',img});
  }catch(e){
    cur.msgs.push({r:'a',img:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200"><rect width="400" height="200" fill="#333"/><text x="200" y="110" font-size="22" fill="#ccc" text-anchor="middle" font-family="sans-serif">Keine Katze gefunden – offline?</text></svg>')});
  }
  save();busy=false;render();
  sendEl.disabled=!inEl.value.trim();
}
inEl.addEventListener('input',()=>{inEl.style.height='auto';inEl.style.height=inEl.scrollHeight+'px';sendEl.disabled=busy||!inEl.value.trim()});
inEl.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey&&innerWidth>760){e.preventDefault();send(inEl.value)}});
sendEl.onclick=()=>send(inEl.value);
$('#new').onclick=newChat;
$('#tog').onclick=()=>side.classList.toggle('hide');
listEl.onclick=e=>{
  const d=e.target.closest('[data-del]');if(d)return del(d.dataset.del,e);
  const c=e.target.closest('.ci');if(c)open(c.dataset.id);
};
chatEl.onclick=e=>{
  const t=e.target;
  if(t.classList.contains('chip'))return send(t.textContent);
  if(t.classList.contains('pic')){$('#lb img').src=t.src;$('#lb').classList.add('on');return}
  const b=t.closest('[data-a]');if(!b)return;
  if(b.dataset.a=='copy'){try{navigator.clipboard.writeText(b.dataset.u);b.innerHTML=ic('check',16)}catch(e){}setTimeout(()=>b.innerHTML=ic('copy',16),1200)}
  if(b.dataset.a=='like')b.classList.toggle('on');
  if(b.dataset.a=='dl')window.open(b.dataset.u,'_blank');
};
$('#lb').onclick=()=>$('#lb').classList.remove('on');
document.documentElement.classList.add('auto');
if(innerWidth<=760)side.classList.add('hide');
cur=chats[0]||null;
if(!cur)newChat();else render();
</script>
</body>
</html>
