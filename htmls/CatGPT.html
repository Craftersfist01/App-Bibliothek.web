<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat GPT</title>
<style>

:root{--bg:#212121;--side:#171717;--panel:#2f2f2f;--hover:#2a2a2a;--text:#ececec;--mute:#9b9b9b;--line:#3a3a3a;--acc:#10a37f}
:root.light{--bg:#fff;--side:#f9f9f9;--panel:#f4f4f4;--hover:#ececec;--text:#0d0d0d;--mute:#6b6b6b;--line:#e5e5e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}i[data-i]{display:inline-flex;flex-shrink:0}
#side{width:270px;background:var(--side);display:flex;flex-direction:column;padding:10px;gap:6px;flex-shrink:0;transition:margin .25s;padding-top:max(10px,env(safe-area-inset-top));z-index:6}
#side.hide{margin-left:-270px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;width:100%;text-align:left}
.nb:hover,.ci:hover,.ci.on{background:var(--hover)}
.srch{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--mute)}
.srch:focus-within{background:var(--hover)}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.lbl{font-size:12px;color:var(--mute);padding:14px 12px 4px}
#list{flex:1;overflow-y:auto}
.ci{display:flex;align-items:center;border-radius:10px;padding:0 4px 0 12px;font-size:14px;cursor:pointer}
.ci span{flex:1;padding:10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .x{opacity:0;padding:8px;color:var(--mute);border-radius:8px}
.ci .x:hover{color:var(--text)}
.ci:hover .x,.ci.on .x{opacity:1}
@media(hover:none){.ci .x{opacity:1}}
.ri{flex:1;min-width:0;margin:4px 0;background:var(--panel);border:1px solid var(--acc);border-radius:8px;color:var(--text);font:inherit;font-size:14px;padding:6px 8px;outline:0}
.usr{display:flex;align-items:center;gap:10px;padding:10px 6px 4px 12px;font-size:14px;border-top:1px solid var(--line)}
.usr span{flex:1}
.ib{padding:8px;border-radius:10px;color:var(--mute);display:grid;place-items:center}
.ib:hover{background:var(--hover);color:var(--text)}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc);display:grid;place-items:center;flex-shrink:0;color:#fff}
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));position:relative}
#top button.tg{padding:8px 10px;border-radius:10px}
#top button.tg:hover{background:var(--hover)}
#mbtn{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;padding:8px 12px;border-radius:10px}
#mbtn small{color:var(--mute);font-weight:400;font-size:15px}
#mmenu{position:absolute;top:56px;left:50px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;width:290px;display:none;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#mmenu.on{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.mi:hover{background:var(--hover)}
.mi div{flex:1}.mi b{display:block;font-size:15px;font-weight:500}.mi small{color:var(--mute);font-size:13px}
.mi .ck{width:20px;color:var(--text)}
#chat{flex:1;overflow-y:auto}
.col{max-width:760px;margin:0 auto;padding:0 18px}
.msg>.col{width:100%;flex:1;min-width:0}
#hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#hero .logo{color:var(--acc);display:flex}
#hero h1{font-size:28px;font-weight:600;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;color:var(--mute)}
.chip:hover{background:var(--hover);color:var(--text)}
.msg{display:flex;padding:14px 0;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg.u .col{display:flex;justify-content:flex-end}
.ub{display:flex;flex-direction:column;align-items:flex-end;max-width:82%;gap:4px}
.bub{background:var(--panel);border-radius:20px;padding:10px 18px;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.uact{display:flex;gap:2px;opacity:0;transition:opacity .15s;color:var(--mute)}
.msg:hover .uact,.msg:hover .act{opacity:1}
@media(hover:none){.uact,.act{opacity:1!important}}
.edit{width:min(560px,86vw);background:var(--panel);border-radius:20px;padding:12px}
.edit textarea{width:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;resize:none;line-height:1.5}
.er{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.btn{padding:8px 16px;border-radius:999px;font-size:14px;border:1px solid var(--line)}
.btn.pri{background:var(--text);color:var(--bg);border-color:var(--text)}
.arow{display:flex;gap:14px}
.bot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0;margin-top:2px}
.body{flex:1;min-width:0}
.pic{display:block;max-width:100%;max-height:420px;border-radius:16px;cursor:zoom-in;background:var(--panel);min-height:120px;min-width:160px;opacity:0;transition:opacity .4s}
.pic.l{opacity:1}
.cap{color:var(--mute);font-size:13px;margin-top:8px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:8}
.fx i{position:absolute;top:-30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r,0deg))}}
@keyframes rise{to{transform:translateY(-112vh) rotate(var(--r,0deg))}}
.cf{border-radius:2px}.sn{border-radius:50%;background:#fff;opacity:.9}
.rn{width:2px;height:18px;background:linear-gradient(transparent,#7aa7ff)}
.cn{width:14px;height:14px;border-radius:50%;background:#f5c542;border:2px solid #d79b00}
.ht{top:auto!important;bottom:-30px;animation-name:rise!important}
#main.shk{animation:shk .6s}@keyframes shk{10%,50%,90%{transform:translateX(-8px)}30%,70%{transform:translateX(8px)}}
.flo{position:fixed;inset:0;pointer-events:none;z-index:8;animation:flo .5s steps(1) 4}@keyframes flo{0%{background:rgba(255,0,120,.18)}25%{background:rgba(0,200,255,.18)}50%{background:rgba(120,255,0,.18)}75%{background:rgba(255,200,0,.18)}}
.stopped{color:var(--mute);padding:6px 0}
.act{display:flex;gap:2px;margin-top:8px;color:var(--mute);opacity:.0;transition:opacity .15s}
.msg:last-child .act{opacity:1}
.act button{padding:7px 8px;border-radius:8px}
.act button:hover{background:var(--hover);color:var(--text)}
.act button.on{color:var(--text)}.act button.on svg{fill:currentColor}
.dn svg{transform:rotate(180deg)}
.dots{display:flex;gap:5px;padding:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-4px)}}
#fab{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:none;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:3}
#fab.on{display:grid}
#bar{padding:8px 14px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#box{max-width:760px;margin:0 auto;background:var(--panel);border-radius:28px;display:flex;align-items:flex-end;padding:8px 8px 8px 12px;gap:4px}
#in{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;resize:none;max-height:180px;padding:8px 6px;line-height:1.4}
#in::placeholder{color:var(--mute)}
#mic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute);flex-shrink:0}
#mic:hover{color:var(--text)}#mic.rec{color:#fff;background:#e5484d;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.6}}
#send{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex-shrink:0;transition:opacity .2s}
#send:disabled{opacity:.25;cursor:default}
.fine{text-align:center;font-size:12px;color:var(--mute);padding-top:8px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:9;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-width:94vw;max-height:88vh;border-radius:12px}
.lbb{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;display:flex;gap:8px}
.lbb button{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:5;display:none}
@media(max-width:760px){#side{position:fixed;height:100%;box-shadow:4px 0 24px rgba(0,0,0,.4)}#side.hide{margin-left:-290px;box-shadow:none}#side:not(.hide)~#shade{display:block}.ub{max-width:92%}#mmenu{left:12px;width:calc(100vw - 24px)}}

/* ---- Erweiterungen ---- */
#bar{position:relative}
#top{gap:4px}#top .sp{flex:1}
.tg.on{background:var(--hover);color:var(--acc)}
#main.tmp{background:var(--side)}
.sub{color:var(--mute);margin:0;max-width:380px}
.usr{width:100%;text-align:left;border:0;border-radius:10px;padding:8px 10px;background:none}
.usr:hover{background:var(--hover)}
.usr span{flex:1}
.hint{color:var(--mute);font-size:13px}
.pop{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;display:none;z-index:8;box-shadow:0 8px 30px rgba(0,0,0,.35);min-width:210px}
.pop.on{display:block}
.pi{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;font-size:14px}
.pi:hover{background:var(--hover)}.pi.red{color:#ff6b6b}
.pph{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:14px}.pph small{display:block;color:var(--mute);margin-top:2px}
#pm{left:10px;bottom:62px;width:250px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:9}
.ov.on{display:grid}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:20px;width:min(780px,94vw);height:min(600px,88vh);display:flex;flex-direction:column;overflow:hidden}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 12px 20px;border-bottom:1px solid var(--line);font-size:17px;font-weight:600}
.dbody{flex:1;display:flex;min-height:0}
#dnav{width:210px;padding:10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;overflow:auto;flex-shrink:0}
.tab{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
.tab.on,.tab:hover{background:var(--hover)}
#dc{flex:1;overflow:auto;padding:4px 22px 22px;min-width:0}
@media(max-width:760px){.dbody{flex-direction:column}#dnav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line)}.tab{white-space:nowrap}.dlg{height:92vh}}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.row small{display:block;color:var(--mute);margin-top:3px;font-size:13px;line-height:1.4}
.row.c2{flex-direction:column;align-items:stretch;gap:8px}
.sel,.inp,.ta{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:14px;padding:9px 11px;outline:0}
.inp,.ta{width:100%}.ta{min-height:90px;resize:vertical}
.sel:focus,.inp:focus,.ta:focus{border-color:var(--acc)}
.kin{display:flex;gap:6px;align-items:center}
.sw{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex-shrink:0;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:21px}
.sws{display:flex;gap:8px}.swc{width:26px;height:26px;border-radius:50%;border:2px solid transparent;outline:2px solid transparent;outline-offset:2px}
.swc.on{outline-color:var(--text)}
.btn.danger{color:#ff6b6b;border-color:rgba(255,107,107,.4)}
.mem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.mem span{flex:1}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding-top:12px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;background:var(--panel)}
.chs{display:flex;gap:8px;padding-top:14px}.chs .chip.on{background:var(--hover);color:var(--text)}
.kb{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kb kbd{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font:inherit;font-size:13px;white-space:nowrap}
.h3{font-size:13px;color:var(--mute);padding:18px 0 4px}
#slash{display:none;position:absolute;bottom:100%;left:14px;right:14px;max-width:732px;margin:0 auto 6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;max-height:250px;overflow:auto;z-index:4}
#slash.on{display:block}
.si{display:flex;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:10px;font-size:14px}
.si b{min-width:92px;font-weight:500}.si span{color:var(--mute)}.si.on,.si:hover{background:var(--hover)}
.memchip{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-bottom:8px;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.vn{font-size:13px;color:var(--mute);padding:0 2px;align-self:center}
.errt{padding:6px 0 4px}
.ci .x{opacity:0}.ci:hover .x,.ci.on .x{opacity:1}
@media(hover:none){.ci .x{opacity:1}}
#cm{width:210px}
.rd{display:none}.msg:last-child .rd{display:inline-block}
.phold{display:flex;align-items:center;justify-content:center;gap:10px;width:min(320px,100%);height:150px;border-radius:16px;background:var(--panel);color:var(--mute);font-size:14px}
.phold:hover{color:var(--text)}
</style>
</head>
<body>
<aside id="side">
  <button class="nb" id="new"><i data-i="edit"></i>Neuer Chat</button>
  <button class="nb" id="libb"><i data-i="image"></i>Bibliothek</button>
  <label class="srch"><i data-i="search" data-s="16"></i><input id="q" placeholder="Chats durchsuchen" autocomplete="off"></label>
  <div id="list"></div>
  <button class="usr" id="usr"><div class="av" id="uav"></div><span id="uname">Katzenfreund</span></button>
</aside>
<div id="shade"></div>
<div id="main">
  <div id="top">
    <button class="tg" id="tog" aria-label="Seitenleiste"><i data-i="menu" data-s="20"></i></button>
    <button id="mbtn"><i data-i="paw" data-s="20"></i><span id="mname">Cat GPT</span><i data-i="chev" data-s="16"></i></button>
    <div id="mmenu"></div>
    <div class="sp"></div>
    <button class="tg" id="tmp" aria-label="Temporärer Chat" title="Temporärer Chat"><i data-i="ghost" data-s="20"></i></button>
  </div>
  <div id="chat"></div>
  <button id="fab" aria-label="Nach unten"><i data-i="down" data-s="18"></i></button>
  <div id="bar">
    <div id="slash"></div>
    <div id="box">
      <button id="mic" aria-label="Diktieren"><i data-i="mic" data-s="20"></i></button>
      <textarea id="in" rows="1" placeholder="Schreib Cat GPT eine Nachricht"></textarea>
      <button id="send" disabled aria-label="Senden"></button>
    </div>
    <div class="fine">Cat GPT kann Fehler machen. Überprüfe wichtige Katzen.</div>
  </div>
</div>
<div class="pop" id="pm"></div>
<div class="pop" id="cm"></div>
<div class="ov" id="modal"><div class="dlg"><div class="dh"><span id="dt"></span><button class="ib" id="dx" aria-label="Schließen"><i data-i="x" data-s="20"></i></button></div><div class="dbody"><nav id="dnav"></nav><div id="dc"></div></div></div></div>
<div id="lb"><img alt=""><div class="lbb"><button id="lbd" aria-label="Speichern"><i data-i="dl" data-s="20"></i></button><button id="lbx" aria-label="Schließen"><i data-i="x" data-s="20"></i></button></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};

edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',

/* ---------- KI ---------- */
async function aiPlan(text){
  const k=S.key.trim(),pv=prov(k);if(!pv)throw new Error('Key-Format nicht erkannt');
  const md=S.aiModel.trim()||PMODEL[pv];
  const tl=await getTags();
  const tagStr=(tl&&tl.length?tl:['cute','sleeping','angry','funny','kitten','fat','fluffy','black','white','orange','grey','tabby','sad']).slice(0,150).join(', ');
  const nm=myName(),facts=memOK()?MEM.map(x=>x.t).join('; '):'';
  const sys='Du bist die Bildauswahl von "Cat GPT", einem ChatGPT-Klon, der auf jede Nachricht nur mit einem Katzenbild antwortet. Wähle ein zur Nachricht passendes, möglichst witziges Katzenbild und eine kurze, trockene Bildunterschrift (Deutsch, höchstens 12 Wörter, keine Emojis). Erkenne Anspielungen, Wortspiele und Bezüge (z. B. "Schrödingers Katze" = Katze im Karton, "wie sehe ich aus" = komisch aussehende Katze, "Montag" = müde Katze).\nAntworte ausschließlich mit einem JSON-Objekt in genau dieser Form:\n{"caption":"...","says":null,"tags":[],"category":null,"breed":null,"gif":false,"fx":null}\n- says: null oder kurzer Text (max. 5 Wörter, ohne Schrägstrich), der groß auf das Bild geschrieben wird\n- tags: höchstens 2 aus dieser Liste: '+tagStr+'\n- category: null oder eine aus boxes, clothes, hats, sinks, space, sunglasses, ties\n- breed: null oder englischer Rassename (z. B. siamese, sphynx, maine coon)\n- gif: true nur, wenn ein bewegtes Bild gewünscht ist\n- fx: null oder confetti, hearts, snow, rain, coins, shake, flash\n'+(nm?'Der Nutzer heißt '+nm+'.\n':'')+(facts?'Bekannt über den Nutzer: '+facts+'.\n':'')+(S.custom.trim()?'Eigene Anweisungen des Nutzers: '+S.custom.trim()+'\n':'');
  const hist=(cur?cur.msgs:[]).slice(-7,-1).map(m=>m.r=='u'?'Nutzer: '+m.t:'Cat GPT: [Katzenbild'+(m.vars&&cv(m).cap?': '+cv(m).cap:'')+']').join('\n');
  const usr='Verlauf:\n'+(hist||'(leer)')+'\n\nWähle jetzt das Bild für diese Nachricht des Nutzers: '+text;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{
    let url,opt,get;
    if(pv=='gemini'){
      url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(md)+':generateContent?key='+encodeURIComponent(k);
      opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:usr}]}],generationConfig:{responseMimeType:'application/json'}})};
      get=j=>j.candidates[0].content.parts.map(p=>p.text||'').join('');
    }else{
      url=pv=='openai'?'https://api.openai.com/v1/chat/completions':'https://openrouter.ai/api/v1/chat/completions';
      const b={model:md,messages:[{role:'system',content:sys},{role:'user',content:usr}]};
      if(pv=='openai')b.response_format={type:'json_object'};
      opt={method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},body:JSON.stringify(b)};
      get=j=>j.choices[0].message.content;
    }
    opt.signal=ctl.signal;
    const r=await fetch(url,opt);
    if(!r.ok){let msg='';try{const e=await r.json();msg=(e.error&&(e.error.message||e.error))||''}catch(_){}throw new Error('HTTP '+r.status+(msg?' – '+String(msg).slice(0,120):''))}
    const txt=get(await r.json());
    return JSON.parse(txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1));
  }catch(e){
    if(e.name=='AbortError')throw new Error('Zeitüberschreitung');
    throw e;
  }finally{clearTimeout(to)}
}

/* ---------- Bildwahl ---------- */
const CMDS=[['/gif','Bewegte Katze'],['/schwarz','Schwarze Katze'],['/weiß','Weiße Katze'],['/orange','Orange Katze'],['/grau','Graue Katze'],['/getigert','Getigerte Katze'],['/kätzchen','Kleine Katze'],['/sag','Katze schreibt deinen Text aufs Bild'],['/orakel','Das Katzenorakel fragen'],['/zufall','Reiner Zufall, ohne Anspielungen']];
const CT={schwarz:'black','weiß':'white',weiss:'white',orange:'orange',grau:'grey',getigert:'tabby','kätzchen':'kitten',kaetzchen:'kitten'};
const FXS=['confetti','hearts','snow','rain','coins','shake','flash'];
function ctxText(texts){
  const t=texts[texts.length-1]||'';
  const m=t.trim().toLowerCase().match(/^(?:und )?(?:noch (?:eins|eine|ein bild|mal|einmal)|mehr|nochmal|weiter|und jetzt|jetzt|und noch eine?|anderes?|was anderes)(?![a-zäöüß])\s*(.*)$/);
  if(!m||texts.length<2)return t;
  return (ctxText(texts.slice(0,-1))+' '+m[1]).trim();
}
async function getCat(texts){
  let text=ctxText(texts);
  const base='https://cataas.com/cat',ts=()=>'t='+Date.now();
  let gif=model==2,forceTag=null,says=null,zufall=false,orakel=false,sagCmd=false;
  const cm=text.match(/^\/(\S+)\s*([\s\S]*)$/);
  if(cm){
    const c=cm[1].toLowerCase(),rest=cm[2].trim();
    if(c=='gif'){gif=true;text=rest}
    else if(CT[c]){forceTag=CT[c];text=rest}
    else if(c=='sag'){says=rest||'Miau';text=rest;sagCmd=true}
    else if(c=='zufall'){zufall=true;text=rest}
    else if(c=='orakel'){orakel=true;text=rest}
  }
  const low=text.toLowerCase(),nm=myName();
  if(!zufall&&/gif|animiert|bewegt|video/.test(low))gif=true;
  const mdl=model==3?0:model;
  const tl=await getTags(),has=t=>!tl.length||tl.includes(t);
  const tg=zufall?[]:TAGS.filter(x=>x[1].test(low)&&has(x[0])).slice(0,2);
  const cat=zufall?null:CATS.find(x=>x[1].test(low)),br=zufall?null:BREEDS.find(x=>x[0].test(low));
  if(!says){
    const m=text.match(/^(?:sag|sage|schreib|schreibe)\s+(?:mir\s+)?(.{1,60})$/i);
    if(m)says=m[1].trim();
    else if(!zufall&&/^(hallo|hi|hey|moin|servus|huhu|guten (morgen|tag|abend))(?![a-zäöüß])/.test(low)&&low.length<24)says=nm?'Hallo '+nm+'!':'Miau!';
  }
  const shout=text.length>=6&&text===text.toUpperCase()&&/[A-ZÄÖÜ]{4}/.test(text);
  let rule=null,aiOn=false;
  if(orakel)rule=['',{says:ORAKEL},'Das Katzenorakel hat gesprochen.'];
  else if(!zufall&&!says&&!forceTag&&model==3&&hasKey()){
    try{
      const a=await aiPlan(text);
      const o={
        says:typeof a.says=='string'&&a.says.trim()?a.says.replace(/[\/\\]/g,' ').trim().slice(0,60):null,
        cat:CATS.some(c=>c[0]==a.category)?a.category:null,
        breed:typeof a.breed=='string'&&a.breed.trim()?a.breed.trim().toLowerCase().slice(0,30):null,
        tags:(Array.isArray(a.tags)?a.tags:[]).filter(t=>typeof t=='string'&&has(t)).slice(0,2),
        fx:FXS.includes(a.fx)?a.fx:null};
      if(a.gif)gif=true;
      rule=['',o,typeof a.caption=='string'?a.caption.trim().slice(0,140):''];aiOn=true;
    }catch(e){toast('KI nicht erreichbar: '+(e.message||e)+'. Regeln werden genutzt.')}
  }
  if(!rule&&!zufall){
    if(shout)rule=['',{says:'Nicht so laut',tags:['scared'],fx:'shake'},'Meine Ohren!'];
    else if(text.length>220)rule=['',{says:'tl;dr'},'Zu lang. Nicht gelesen.'];
    else if(/wie hei(?:ß|ss)e ich|wer bin ich/i.test(low))rule=['',{says:nm?'Du bist '+nm:'Keine Ahnung'},nm?'Ich vergesse nie einen Namen. Nur Gesichter.':'Sag es mir, dann merke ich es mir.'];
    else rule=RULES.find(x=>x[0].test(low));
    if(!rule&&!says&&!tg.length&&!cat&&!br&&!forceTag&&/\?\s*$/.test(text))rule=['',{says:ORAKEL},'Das Katzenorakel hat gesprochen.'];
  }
  const o=rule?rule[1]:{},rc=rule?pick(rule[2]):'';
  const sayUrl=(t,tag)=>`${base}${tag?'/'+tag:''}/says/${encodeURIComponent(t)}?fontSize=52&fontColor=white&${ts()}`;
  const byCat=(n,cap)=>async()=>{const c=(await getCats()).find(x=>x.name==n);const j=await jget('https://api.thecatapi.com/v1/images/search?limit=1&category_ids='+c.id+(gif?'&mime_types=gif':''));return{url:j[0].url,cap}};
  const byBreed=(q2,cap)=>async()=>{const b=await jget('https://api.thecatapi.com/v1/breeds/search?q='+encodeURIComponent(q2));const j=await jget('https://api.thecatapi.com/v1/images/search?limit=1&breed_ids='+b[0].id);return{url:j[0].url,cap}};
  const cj=async p=>{try{const j=await jget(base+p+'?json=true&'+ts());let u=j.url||('/cat/'+j.id);if(!/^http/.test(u))u='https://cataas.com'+(u.charAt(0)=='/'?'':'/')+u;return u}catch(e){return null}};
  const byTag=(t,cap)=>async()=>({url:(await cj('/'+t))||`${base}/${t}?${ts()}`,cap});
  const L=[];
  if(forceTag&&has(forceTag)&&mdl!=2)L.push(byTag(forceTag,''));
  if(says)L.push(()=>({url:sayUrl(says,tg[0]&&tg[0][0]),cap:(sagCmd?'':'Cat GPT sagt: ')+says}));
  if(o.says)L.push(()=>({url:sayUrl(pick(o.says)),cap:rc}));
  if(mdl!=1){
    if(o.cat)L.push(byCat(o.cat,rc));
    if(o.breed&&!gif)L.push(byBreed(o.breed,rc));
  }
  if(mdl!=2&&o.tags)o.tags.filter(has).forEach(t=>L.push(byTag(t,rc)));
  if(mdl!=1&&!zufall){
    if(br&&!gif)L.push(byBreed(br[1],br[2]));
    if(cat)L.push(byCat(cat[0],cat[2]));
  }
  if(mdl!=2&&tg.length){
    if(tg.length>1)L.push(async()=>({url:(await cj('/'+tg.map(x=>x[0]).join(',')))||`${base}/${tg.map(x=>x[0]).join(',')}?${ts()}`,cap:tg.map(x=>x[2]).join(' · ')}));
    tg.forEach(x=>L.push(byTag(x[0],x[2])));
  }
  const pf=S.pref||(S.mem&&!(cur&&cur.tmp)&&(MEM.find(x=>x.k=='color')||{}).v)||'';
  if(pf&&!zufall&&!forceTag&&mdl!=2&&has(pf))L.push(byTag(pf,rc));
  if(mdl!=1)L.push(async()=>{const j=await jget('https://api.thecatapi.com/v1/images/search'+(gif?'?mime_types=gif':''));return{url:j[0].url,cap:rc}});
  L.push(async()=>({url:(await cj(gif?'/gif':''))||`${base}${gif?'/gif':''}?${ts()}`,cap:rc}));
  for(const f of L){try{const r=await f();await preload(r.url);return{img:r.url,cap:r.cap,gif:gif||undefined,fx:rule&&r.cap===rc?o.fx:null}}catch(e){}}
  throw 0;
}

/* ---------- Chats ---------- */
const prune=keep=>{chats=chats.filter(c=>c===keep||(!c.tmp&&c.msgs.length))};
function newChat(tmp){
  if(!tmp&&cur&&!cur.tmp&&!cur.msgs.length){render();closeSide();return}
  const c={id:uid(),title:'Neuer Chat',msgs:[],ts:Date.now(),tmp:!!tmp};

    return;
  }
  const arr=cur.msgs.map(msgHTML);

  if(chatEl.dataset.ok!=='1'||chatEl.dataset.cid!==cur.id){chatEl.innerHTML='';rendered=[];chatEl.dataset.ok='1';chatEl.dataset.cid=cur.id;stick=true}
  if(arr.length!==rendered.length)stick=true;
  const kids=Array.from(chatEl.children);
  for(let i=0;i<arr.length;i++){
    if(rendered[i]===arr[i]&&kids[i])continue;
    const t=document.createElement('div');t.innerHTML=arr[i];const el=t.firstElementChild;
    const oi=kids[i]&&kids[i].querySelector('.pic'),ni=el.querySelector('.pic');

  rendered=arr;
  const et=$('#et');

async function gen(ri=-1){
  busy=true;regenIdx=ri;upd();const id=++run;render();
  const t0=Date.now(),idx=ri>=0?ri:cur.msgs.length,texts=cur.msgs.slice(0,idx).filter(m=>m.r=='u').map(m=>m.t);
  let v=null,err=false;
  if(S.errs&&ri<0&&Math.random()<.03){err=true;await wait(1100)}
  else{
    try{v=await getCat(texts)}catch(e){v={img:FAIL,cap:'',fail:1}}
    await wait(Math.max(0,700-(Date.now()-t0)));
  }
  if(id!==run)return;
  if(err)cur.msgs.push({r:'a',err:1});
  else{
    FRESH.add(v);if(pendingMem&&ri<0){v.mem=pendingMem;pendingMem=null}
    if(ri>=0){const m=cur.msgs[ri];m.vars.push(v);m.vi=m.vars.length-1}
    else cur.msgs.push({r:'a',vars:[v],vi:0});
    animIdx=ri>=0?ri:cur.msgs.length-1;
  }
  regenIdx=-1;busy=false;cur.ts=Date.now();save();render();upd();
  if(v&&v.fx&&S.fx)setTimeout(()=>fx(v.fx),350);
}
function stop(){
  if(!busy)return;
  run++;busy=false;
  if(regenIdx>=0)regenIdx=-1;else cur.msgs.push({r:'a',stopped:1});
  save();render();upd();
}
function send(text){
  text=text.trim();if(!text||busy)return;
  if(!cur)newChat();
  if(!cur.msgs.length)cur.title=text.slice(0,40);
  cur.msgs.push({r:'u',t:text});cur.ts=Date.now();
  pendingMem=learn(text);
  save();inEl.value='';grow();gen();
}

/* ---------- Bild-Aktionen ---------- */
function showLb(u){$('#lb img').src=u;$('#lb').classList.add('on')}
async function dl(u,fromLb){
  if(!u||u.startsWith('data:')){toast('Kein Bild zum Speichern');return}
  try{
    const r=await fetch(u);if(!r.ok)throw 0;
    const b=await r.blob();
    const ext=(b.type.split('/')[1]||'jpg').replace('jpeg','jpg').split('+')[0];
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='katze.'+ext;
    document.body.appendChild(a);a.click();a.remove();
    const h=a.href;setTimeout(()=>URL.revokeObjectURL(h),5000);
    toast('Bild wird gespeichert');
  }catch(e){
    if(!fromLb)showLb(u);
    toast('Halte das Bild gedrückt, um es zu sichern');
  }
}
async function copyImg(u){
  try{
    const b=await (await fetch(u)).blob();const bmp=await createImageBitmap(b);
    const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;c.getContext('2d').drawImage(bmp,0,0);
    const pb=await new Promise(r=>c.toBlob(r,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':pb})]);toast('Bild kopiert');
  }catch(e){
    try{await navigator.clipboard.writeText(u);toast('Link kopiert')}catch(_){toast('Kopieren nicht möglich')}
  }
}

chatEl.onclick=e=>{
  const t=e.target;
  if(t.classList.contains('chip'))return send(t.textContent);
  if(t.classList.contains('pic'))return showLb(t.src);
  const b=t.closest('[data-a]');if(!b)return;
  const i=+b.dataset.i,m=cur.msgs[i],a=b.dataset.a;
  if(a=='ecancel'){editing=-1;render();return}
  if(a=='load'&&m&&m.vars){SHOWN.add(cv(m));render();return}
  if(busy||!m)return;
  const v=m.vars?cv(m):null;
  if(a=='ucopy'){try{navigator.clipboard.writeText(m.t);toast('Text kopiert')}catch(e){}}
  if(a=='uedit'){editing=i;render()}
  if(a=='esave'){const x=$('#et').value.trim();if(!x)return;editing=-1;cur.msgs=cur.msgs.slice(0,i);send(x)}
  if(a=='copy')copyImg(v.img);
  if(a=='up'||a=='down'){m.v=m.v==a?null:a;save();render()}
  if(a=='vp'||a=='vn'){m.vi=Math.max(0,Math.min(m.vars.length-1,m.vi+(a=='vp'?-1:1)));save();render()}
  if(a=='retry'){cur.msgs.splice(i,1);gen()}
  if(a=='redo'){if(!m.vars){cur.msgs.splice(i,1);gen()}else gen(i)}
  if(a=='dl')dl(v.img);
};

$('#dc').addEventListener('change',e=>setF(e.target));
$('#dc').addEventListener('input',e=>{
  if(e.target.id=='keyin')$('#kprov').textContent=provLabel(e.target.value);
  else if(e.target.dataset.f&&e.target.tagName!='SELECT')setF(e.target);
});
$('#dc').addEventListener('click',async e=>{
  const t=e.target;
  const swt=t.closest('[data-sw]');if(swt){S[swt.dataset.sw]=!S[swt.dataset.sw];saveS();modal('settings');return}
  const ac=t.closest('[data-acc]');if(ac){S.accent=ac.dataset.acc;saveS();applyTheme();modal('settings');return}
  const lb=t.closest('[data-lib]');if(lb){const st=$('#dc').scrollTop;if(lb.dataset.lib=='more')libN+=12;else{libFav=lb.dataset.lib=='fav';libN=12}modal('lib');$('#dc').scrollTop=st;return}
  if(t.dataset.gal){showLb(t.src);return}
  const d=t.closest('[data-do]');if(!d)return;
  const a=d.dataset.do;
  if(a=='eye'){const i=$('#keyin');i.type=i.type=='password'?'text':'password';return}
  if(a=='memdel'){MEM.splice(+d.dataset.id,1);saveMem();modal('settings');updTop();return}
  if(a=='delmem'){armed(d,()=>{MEM=[];saveMem();modal('settings');updTop()});return}
  if(a=='delchats'){armed(d,()=>{chats=[];cur=null;save();newChat();toast('Alle Chats gelöscht')});return}
  if(a=='reset'){armed(d,()=>{const k=S.key,m=S.aiModel;Object.assign(S,DEF,{key:k,aiModel:m});saveS();applyTheme();modal('settings');updTop()});return}
  if(a=='export'){
    const b=new Blob([JSON.stringify({chats:chats.filter(c=>!c.tmp),memory:MEM},null,1)],{type:'application/json'});
    const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='cat-gpt-chats.json';document.body.appendChild(l);l.click();l.remove();return;
  }
  if(a=='keydel'){S.key='';S.aiModel='';saveS();if(model==3){model=0;ls('catgpt_model',0)}modal('settings');updTop();toast('Key entfernt');return}
  if(a=='keysave'){
    const k=$('#keyin').value.trim();
    if(!k){S.key='';saveS();if(model==3)model=0;updTop();toast('Key entfernt');return}
    if(!prov(k)){toast('Key-Format nicht erkannt');return}
    S.key=k;S.aiModel=$('#kmod').value.trim();saveS();model=3;ls('catgpt_model',3);updTop();
    $('#kprov').textContent=provLabel(k);toast('Key gespeichert. Meow-4 KI ist aktiv.');return;
  }
  if(a=='keytest'){
    const k=$('#keyin').value.trim();if(!prov(k)){$('#kstat').textContent='Bitte zuerst einen gültigen Key eingeben.';return}
    const old=[S.key,S.aiModel];S.key=k;S.aiModel=$('#kmod').value.trim();
    $('#kstat').textContent='Teste Verbindung …';
    try{const r=await aiPlan('Hallo, ich teste dich');$('#kstat').textContent='Verbindung ok ('+PNAME[prov(k)]+'). Beispiel-Bildunterschrift: '+(r.caption||'(leer)')}
    catch(err){$('#kstat').textContent='Fehler: '+(err.message||err)}
    S.key=old[0];S.aiModel=old[1];
  }
});

/* Lightbox */
$('#lb').onclick=()=>$('#lb').classList.remove('on');
$('#lbd').onclick=e=>{e.stopPropagation();dl($('#lb img').src,true)};
$('#lbx').onclick=e=>{e.stopPropagation();$('#lb').classList.remove('on')};

/* Tastenkürzel */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(e.key=='Escape'){$('#lb').classList.remove('on');hidePops();if($('#modal').classList.contains('on'))closeModal()}
  if(mod&&e.key.toLowerCase()=='k'){e.preventDefault();side.classList.remove('hide');$('#q').focus()}
  if(mod&&e.shiftKey&&e.key.toLowerCase()=='o'){e.preventDefault();newChat(false)}
  if(mod&&e.shiftKey&&e.key.toLowerCase()=='s'){e.preventDefault();side.classList.toggle('hide')}
});

/* Diktieren */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('#mic').style.display='none';
else $('#mic').onclick=()=>{
  if(rec){rec.stop();return}
  const base=inEl.value?inEl.value+' ':'';
  rec=new SR();rec.lang='de-DE';rec.interimResults=true;
  rec.onresult=e=>{inEl.value=base+Array.from(e.results).map(r=>r[0].transcript).join('');grow()};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('rec')};
  rec.onerror=()=>{rec=null;$('#mic').classList.remove('rec');toast('Diktieren nicht verfügbar')};
  $('#mic').classList.add('rec');rec.start();
};

addEventListener('error',e=>toast('Fehler: '+(e.message||'unbekannt')));
addEventListener('unhandledrejection',e=>toast('Fehler: '+((e.reason&&e.reason.message)||'unbekannt')));
if(mob())side.classList.add('hide');
cur=chats[0]||null;
if(!cur)newChat();else render();
upd();
if(SAFE)toast('Sicherer Modus: Bilder laden erst auf Tipp.');
</script>
</body>
</html>
